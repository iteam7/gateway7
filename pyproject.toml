[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gateway7"
version = "0.1.0"
description = "A minimal ordered-plugin LLM gateway with a deterministic HTTP demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "prometheus-client>=0.21,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
gateway7 = "gateway7.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6.0,<7",
  "build>=1.2,<2",
  "openai>=3.37.0,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gateway7", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
files = ["gateway7"]
