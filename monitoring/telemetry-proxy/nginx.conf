events {}
http {
  server {
    listen 8443 ssl;
    ssl_certificate /etc/gateway7/server.crt;
    ssl_certificate_key /etc/gateway7/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://op-proxy:80;
    }
  }
  server {
    listen 8444 ssl;
    ssl_certificate /etc/gateway7/server.crt;
    ssl_certificate_key /etc/gateway7/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://openobserve:5080;
    }
  }
}
