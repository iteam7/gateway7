site_name: Gateway7
site_description: Apply your team’s policies to LLM requests and answers. Start with a local demo, connect your app, and write Python middleware.
site_url: https://iteam7.github.io/gateway7/
repo_url: https://github.com/iteam7/gateway7
edit_uri: ""
docs_dir: docs
site_dir: site
strict: true

theme:
  name: mkdocs
  color_mode: light
  highlightjs: false
  navigation_depth: 3

nav:
  - Home: README.md
  - Get started:
      - Quickstart: quickstart.md
      - Setup and providers: setup.md
      - Connect through a proxy: provider-transports.md
      - Deploy to the university VM: deployment.md
  - Use the gateway:
      - Features: features.md
      - Connect your application: api.md
      - Control client access: authentication.md
      - Operate the administration console: admin-controls.md
      - Operator identities and recovery: operator-identities.md
      - Usage, pricing and budgets: accounting.md
      - Apply policies: middleware-catalog.md
      - Write a middleware: authoring.md
      - Plugin policy recipes: plugin-cookbook.md
      - Write plugins with an agent: plugin-agent-guide.md
      - Measure product use: analytics.md
      - Monitor the service: observability.md
  - Understand:
      - Architecture and request flow: architecture/README.md
      - Gateway and monitoring stack: architecture/adr/ADR-001.md
      - Trusted middleware: architecture/adr/ADR-002.md
      - Credentials and model access: architecture/adr/ADR-003.md
      - Provider transport proposal: architecture/adr/ADR-004.md
      - Guarded streaming and agent turns: architecture/adr/ADR-005.md
      - Product event pipeline proposal: architecture/adr/ADR-006.md
      - Operating signal pipeline proposal: architecture/adr/ADR-007.md
      - Managed accounts and usage proposal: architecture/adr/ADR-008.md
      - PostgreSQL management proposal: architecture/adr/ADR-009.md
      - Versioned control and accounting proposal: architecture/adr/ADR-010.md
      - Live provider and credential proposal: architecture/adr/ADR-011.md
      - Profile-aware plugin authoring proposal: architecture/adr/ADR-012.md
