          - FR-018 Apply additional client middleware: functional-requirements/fr/FR-018.md
          - FR-019 Read operator client usage: functional-requirements/fr/FR-019.md
          - FR-020 Inspect clients and middleware: functional-requirements/fr/FR-020.md
          - FR-021 Manage client accounts: functional-requirements/fr/FR-021.md
          - FR-022 Dropped account transfer proposal: functional-requirements/fr/FR-022.md
          - FR-023 Authorize named operators: functional-requirements/fr/FR-023.md
          - FR-024 Enforce usage budgets: functional-requirements/fr/FR-024.md
          - FR-025 Manage provider and effective models: functional-requirements/fr/FR-025.md
          - FR-026 Inspect protected client activity: functional-requirements/fr/FR-026.md
          - FR-027 Audit administrative changes: functional-requirements/fr/FR-027.md
