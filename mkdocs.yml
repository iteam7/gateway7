      - Comparison: research/comparison.md
      - Gap analysis: research/gap-analysis.md
      - Value propositions: research/value-proposition.md

markdown_extensions:
  - fenced_code
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

hooks:
  - docs-build/hooks.py
extra_javascript:
  - assets/mermaid.min.js
  - assets/mermaid-init.js
extra_css:
  - assets/diagrams.css
  - assets/guides.css
