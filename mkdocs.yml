site_name: Gateway7
site_description: Apply your team’s policies to LLM requests and answers. Start with a local demo, connect your app, and write Python middleware.
site_url: https://iteam7.github.io/gateway7/
repo_url: https://github.com/iteam7/gateway7
edit_uri: ""
docs_dir: docs
site_dir: site
strict: true

theme:
  name: mkdocs
  color_mode: light
  highlightjs: false
  navigation_depth: 3

nav:
  - Home: README.md
  - Get started:
      - Quickstart: quickstart.md
      - Setup and providers: setup.md
  - Use the gateway:
      - Connect your application: api.md
      - Control client access: authentication.md
      - Apply policies: middleware-catalog.md
      - Write a middleware: authoring.md
      - Monitor the service: observability.md
  - Reference:
      - CLI commands: cli.md
      - Middleware API: plugins.md
      - Demonstration and acceptance: demo.md
  - Product:
      - Product vision: product-vision.md
      - Threshold of success: threshold-of-success.md
      - Threshold review proposal: threshold-review.md
      - Project plan: project-plan.md
      - Risks: risks.md
      - Architecture:
          - Overview and containers: architecture/README.md
          - Gateway and monitoring stack: architecture/adr/ADR-001.md
          - Trusted middleware: architecture/adr/ADR-002.md
          - Credentials and model access: architecture/adr/ADR-003.md
          - ADR template: architecture/adr/TEMPLATE.md
      - Quality requirements:
          - Priority matrix: quality-requirements/README.md
          - QR-01 Refuse forwarding after a request-side failure: quality-requirements/qr/QR-01.md
          - QR-02 Catch a broken gateway change offline: quality-requirements/qr/QR-02.md
          - QR-03 Keep credentials and text out of output: quality-requirements/qr/QR-03.md
          - QR-04 Serve an unmodified OpenAI SDK client: quality-requirements/qr/QR-04.md
      - Functional requirements:
          - Index: functional-requirements/README.md
          - FR-001 Answer with the server-held key: functional-requirements/fr/FR-001.md
          - FR-002 Mask phone numbers: functional-requirements/fr/FR-002.md
          - FR-003 Run company middleware: functional-requirements/fr/FR-003.md
          - FR-004 Block or log a flagged request: functional-requirements/fr/FR-004.md
          - FR-005 Check the answer before delivery: functional-requirements/fr/FR-005.md
          - FR-006 Restrict clients to allowed models: functional-requirements/fr/FR-006.md
          - FR-007 Check middleware offline: functional-requirements/fr/FR-007.md
          - FR-008 Generate a middleware starter: functional-requirements/fr/FR-008.md
          - FR-009 Expose metrics: functional-requirements/fr/FR-009.md
          - FR-010 Show the overview dashboard: functional-requirements/fr/FR-010.md
      - Decisions: decisions.md
      - Assumptions: assumptions.md
      - Definition of Done: definition-of-done.md
      - Glossary: glossary.md
  - Research:
      - Alternatives: research/alternatives.md
      - Comparison: research/comparison.md
      - Gap analysis: research/gap-analysis.md
      - Value propositions: research/value-proposition.md

markdown_extensions:
  - fenced_code
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

hooks:
  - docs-build/hooks.py
extra_javascript:
  - assets/mermaid.min.js
  - assets/mermaid-init.js
extra_css:
  - assets/diagrams.css
  - assets/guides.css
