<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1370" viewBox="0 0 1440 1370" role="img" aria-labelledby="title description">
<title id="title">Gateway7 C4 component view</title>
<desc id="description">One gateway application is expanded into startup and configuration, HTTP boundary and access, middleware pipeline, provider adapter, metrics and diagnostics, and plugin authoring and offline tests. HTTP chat enters the middleware pipeline and calls one configured external LLM provider. Startup configures these components. HTTP and pipeline work produce safe observations. Offline CLI tests reuse the pipeline in a separate worker with fixture replies, without the HTTP provider adapter. Components group Python responsibilities, not independently deployed services.</desc>
