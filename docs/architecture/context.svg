<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="Helvetica, Arial, sans-serif">
  <title>gateway7 system context diagram</title>
  <rect x="0" y="0" width="860" height="460" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">gateway7 — system context</text>

  <!-- boundary frame around the product -->
  <rect x="300" y="160" width="260" height="140" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- product box -->
  <rect x="320" y="190" width="220" height="80" rx="8" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="430" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">gateway7</text>
  <text x="430" y="242" text-anchor="middle" font-size="12" fill="#e5e7eb">gateway + plugin runtime</text>

  <!-- caller application actor -->
  <rect x="40" y="195" width="190" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="135" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Caller application</text>
  <text x="135" y="241" text-anchor="middle" font-size="11" fill="#374151">(actor)</text>

  <!-- administrator actor -->
  <rect x="40" y="40" width="230" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="155" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">IT / policy administrator</text>
  <text x="155" y="86" text-anchor="middle" font-size="11" fill="#374151">(actor)</text>

  <!-- LLM provider external system -->
  <rect x="630" y="195" width="190" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="725" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">LLM Provider</text>
  <text x="725" y="241" text-anchor="middle" font-size="11" fill="#374151">(external system)</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- admin -> gateway7 -->
  <path d="M170,110 C170,150 300,150 340,190" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="150" font-size="11" fill="#111827">configures plugins &amp; policy</text>

  <!-- caller -> gateway7 -->
  <path d="M230,215 L320,215" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="208" font-size="11" fill="#111827">chat request</text>

  <!-- gateway7 -> caller -->
  <path d="M320,248 L230,248" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="265" font-size="11" fill="#111827">filtered response</text>

  <!-- gateway7 -> provider -->
  <path d="M540,215 L630,215" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="543" y="208" font-size="11" fill="#111827">forwarded prompt (if allowed)</text>

  <!-- provider -> gateway7 -->
  <path d="M630,248 L540,248" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="265" font-size="11" fill="#111827">completion</text>

  <text x="725" y="300" text-anchor="middle" font-size="11" fill="#6b7280">meters &amp; bills usage (BND-03)</text>

  <text x="430" y="400" text-anchor="middle" font-size="11" fill="#6b7280">Dashed line marks the boundary: everything inside it is gateway7's responsibility.</text>
  <text x="430" y="418" text-anchor="middle" font-size="11" fill="#6b7280">Source: docs/architecture/context.mmd</text>
</svg>
