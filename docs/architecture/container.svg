<text x="932" y="1004" font-size="14" fill="#52657c" font-weight="400" text-anchor="start">Demo-only note</text>
<path d="M 1200 998 H 1240" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1254" y="1004" font-size="14" fill="#52657c" font-weight="400" text-anchor="start">Initiator → dependency</text>
<text x="48" y="1042" font-size="14" fill="#52657c" font-weight="400" text-anchor="start">Arrows name the protocol and exchanged data; response data returns along the same connection.</text>
