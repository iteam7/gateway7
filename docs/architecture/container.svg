<text x="382" y="1004" font-size="14" fill="#52657c" font-weight="400" text-anchor="start">External system</text>
<rect x="614" y="990" width="22" height="17" rx="4" fill="#fafcff" stroke="#93a6bd" stroke-width="2" stroke-dasharray="4 3"/>
