<text x="936" y="376" font-size="16" fill="#52657c" font-weight="400" text-anchor="middle">text messages / answer + usage</text>
<path d="M 356 732 V 600" fill="none" stroke="#52657c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="96" y="651" font-size="17" fill="#14253d" font-weight="700" text-anchor="start">HTTP GET /metrics</text>
<text x="96" y="677" font-size="16" fill="#52657c" font-weight="400" text-anchor="start">Prometheus samples</text>
<path d="M 910 732 V 684 H 500 V 732" fill="none" stroke="#52657c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="705" y="638" font-size="17" fill="#14253d" font-weight="700" text-anchor="middle">HTTP · PromQL</text>
<text x="705" y="664" font-size="16" fill="#52657c" font-weight="400" text-anchor="middle">queries / metric results</text>
<rect x="48" y="990" width="22" height="17" rx="4" fill="#eff6ff" stroke="#215baf" stroke-width="2"/>
<text x="82" y="1004" font-size="14" fill="#52657c" font-weight="400" text-anchor="start">Application container</text>
