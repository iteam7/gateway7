name: User story
description: Record a user need, its evidence, priority reason, and acceptance criteria.
labels: ["user-story"]
body:
  - type: markdown
    attributes:
      value: |
        Name the issue `US-nn: story title`, using the next unused story ID.
        After creating it, apply exactly one priority label:
        `moscow:must`, `moscow:should`, `moscow:could`, or `moscow:won't`.
        This issue is the source of truth; do not create a second story list in the repository.
        Work on this story through task issues. Never use this story as a pull request's
        closing issue, create a pull request branch from it, or link it in the pull request's
        Development sidebar. Close a planned story only after the customer accepts it.
  - type: textarea
    id: statement
    attributes:
      label: Story statement
      description: State the user's need as "As a ..., I want ..., so that ..."; leave the implementation open.
    validations:
      required: true
  - type: input
    id: value-proposition
    attributes:
      label: Value proposition
      description: |
        Exactly one Markdown-linked VP-nn that this story supports.
        Link its section on main: https://github.com/iteam7/gateway7/blob/main/docs/research/value-proposition.md#vp-nn.
        Use the section's current anchor; merge the file before linking it.
    validations:
      required: true
  - type: textarea
    id: traces
    attributes:
      label: Traces to
      description: |
        One Markdown-linked entry per line, using full gateway7 URLs on main.
        List the GAP-nn, DEC-nnn, or action point that originated the need, if any.
        A GAP-nn must be one that the story's value proposition closes.
        URL pattern: https://github.com/iteam7/gateway7/blob/main/docs/research/gap-analysis.md#gap-nn.
        For a decision or action point, use its own file and anchor on main.
        Keep assumptions in Rests on instead.
    validations:
      required: false
  - type: textarea
    id: rests-on
    attributes:
      label: Rests on
      description: |
        One Markdown-linked ASM-nn assumption per line, if this story rests on any.
        URL pattern: https://github.com/iteam7/gateway7/blob/main/docs/assumptions.md#asm-nn.
        Use the section's current anchor; merge the file before linking it.
    validations:
      required: false
  - type: textarea
    id: priority-reason
    attributes:
      label: Priority reason
      description: Name the chosen MoSCoW priority, explain why the adjacent priority is unsuitable, and cite any constraint that drives it.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        Required for every story except Won't Have: at least two observable pass/fail checks.
        Start each check with a stable AC-nn ID, numbered within this story.
        Cover the normal path and an edge or failure case where relevant.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, assumptions, open questions, or supporting context.
  - type: textarea
    id: remaining-work
    attributes:
      label: Remaining work
      description: Optional bullet list of task issue references that deliver this story; closing the tasks does not close the story.
