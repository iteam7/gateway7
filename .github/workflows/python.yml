name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check Python syntax
        run: uv run --locked python -m compileall -q gateway7 demo examples tests
      - name: Run tests
        run: uv run --locked pytest
      - name: Exercise separate HTTP processes
        run: uv run --locked python -m demo.run
