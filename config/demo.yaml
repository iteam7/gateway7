# Explicitly unauthenticated synthetic fixture; real providers forbid this.
auth:
  enabled: false
provider:
  kind: fake
  base_url: http://127.0.0.1:8001
  key_env: FAKE_LLM_API_KEY
  model: fake
limits:
  request_timeout_seconds: 10
  hook_timeout_seconds: 2
  max_body_bytes: 65536
plugins:
  mask:
    module: gateway7.plugins.phone_mask
    enabled: true
    required: true
    settings: {}
middleware: [mask]
