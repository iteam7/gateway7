# Optional local SQLite management; use after compose.yaml (and optionally compose.live.yaml).
# Configure auth.management_db: /var/lib/gateway7/admin.sqlite3 in the server YAML.
# Prepare the host directory for service UID/GID 10001:10001; see docs/authentication.md.
services:
  gateway:
    command: ["serve", "--config", "/etc/gateway7/gateway.yaml", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - ${GATEWAY_KEY_ENV:-OPENAI_API_KEY}
      - GATEWAY7_OPERATOR_TOKEN
    volumes:
      - ${GATEWAY_CONFIG_FILE:-./config/admin-sqlite.yaml}:/etc/gateway7/gateway.yaml:ro
      - type: bind
        source: ${GATEWAY7_ADMIN_STATE_DIR:?Set a private writable directory outside the checkout}
        target: /var/lib/gateway7
        bind:
          create_host_path: false
