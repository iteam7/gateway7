# PostgreSQL-backed administration; use after compose.yaml.
# Select config/admin-postgres.yaml or an equivalent private server configuration.
# Set the private provider key, operator token and database password before startup.
services:
  gateway:
    command: ["serve", "--config", "/etc/gateway7/gateway.yaml", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - ${GATEWAY_KEY_ENV:-OPENAI_API_KEY}
      - GATEWAY7_OPERATOR_TOKEN
      - GATEWAY7_CONTROL_KEY
      - TELEMETRY_ENABLED
      - GATEWAY7_ENVIRONMENT
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_HEADERS
      - ANALYTICS_ENABLED
      - ANALYTICS_SOURCE
      - ANALYTICS_PARTICIPANT_CODE
      - OPENPANEL_API_URL
      - OPENPANEL_CLIENT_ID
      - OPENPANEL_CLIENT_SECRET
      - GATEWAY7_DATABASE_URL=${GATEWAY7_DATABASE_URL:-postgresql://gateway7@postgres:5432/gateway7}
      # libpq reads PGPASSWORD separately; no URI-escaping of the password is needed.
      - PGPASSWORD=${GATEWAY7_POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - ${GATEWAY_CONFIG_FILE:-./config/admin-postgres.yaml}:/etc/gateway7/gateway.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7 # PostgreSQL 17 Alpine
    environment:
      POSTGRES_DB: gateway7
      POSTGRES_USER: gateway7
      POSTGRES_PASSWORD: ${GATEWAY7_POSTGRES_PASSWORD:?Set a private database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=16m,mode=3775
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    stop_grace_period: 30s

volumes:
  postgres-data:
